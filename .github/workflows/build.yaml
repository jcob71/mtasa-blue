name: Build

on:
  pull_request:
    branches:
      - release/1.6.0
  push:
    branches:
      - release/1.6.0
  workflow_dispatch:

jobs:
  windows:
    strategy:
      matrix:
        platform: [win32]
    name: windows-${{ matrix.platform }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://mirror-cdn.multitheftauto.com/bdata/DXFiles.zip -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Restore VS2022 build tools
        run: |
          git fetch --no-tags origin 6112ac6409214012a95ea56ff1739940ee524798
          git checkout 6112ac6409214012a95ea56ff1739940ee524798 -- premake5.lua utils/premake5.exe win-create-projects.bat
          grep -q 'toolset "v143"' premake5.lua
          grep -q 'vs2022' win-create-projects.bat
        shell: bash

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Run Build
        run: win-build.bat release ${{ matrix.platform }}
        shell: cmd
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Create build artifacts
        run: utils\premake5 compose_files

      - uses: actions/upload-artifact@v4
        with:
          name: InstallFiles-${{ matrix.platform }}
          path: InstallFiles/

